# nav2.yaml + a static_layer, for navigating on the SAVED 2D GRID instead of a
# reloaded nvblox volume.
#
# WHY THIS EXISTS
# Reloading home.nvblx gives Nav2 global knowledge of the space and costs
# 3.3 GB of RAM -- measured on this board as 3657 MB used without it against
# 6934 MB with it, leaving ~600 MB free of 7546 and ruling out running any
# model on the robot. The same 202 m^2 is already saved as home_2d.pgm, at
# 115 KB.
#
# So the static_layer supplies the global map from that file, and nvblox_layer
# keeps doing the thing it is genuinely good at: live obstacles that a saved
# map cannot know about. ORDER MATTERS -- static first, nvblox on top, so
# anything that has moved since the map was built still marks the costmap and
# still gets planned around.
#
# The honest limit is that the 2D grid is a snapshot from the mapping run, so
# furniture moved since is missing FROM THAT LAYER. It is not missing from the
# costmap, because the nvblox layer above it is live. Navigation here is 2D
# either way: nvblox runs esdf_mode 2d, sliced 0.05-0.20 m.

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # MEASURED FAILURE. At the stock 20 ms, bt_navigator gave up ~1 s into
    # every long goal with
    #
    #   Timed out while waiting for action server to acknowledge goal request
    #   for follow_path
    #   [navigate_to_pose] [ActionServer] Aborting handle.
    #   Goal failed
    #
    # 20 ms is how long controller_server gets to ACKNOWLEDGE a goal, and on
    # this board it is mid-MPPI-solve when the request arrives. The robot still
    # drove, because controller_server executes follow_path independently once
    # it has the goal -- but the behaviour tree had already aborted, so NOTHING
    # was supervising it: no replanning, no recovery, and behavior_server never
    # activated a single spin, backup or wait across any run. That is why the
    # robot stopped where it stopped instead of recovering and continuing.
    #
    # 500 ms is generous against a 20 Hz controller and costs nothing when the
    # server is responsive: it is a ceiling on waiting, not a delay.
    # 2000 ms. 500 was not enough: bt_navigator still timed out acknowledging
    # the FIRST follow_path of each session, and only the first -- a second
    # goal in the same session never times out. That signature is first-contact
    # discovery between bt_navigator and controller_server, not load, and it
    # cost the first goal of every run its supervision: the tree aborted while
    # controller_server drove on unwatched, with no replanning and no recovery.
    # This is a ceiling on waiting, not a delay, so a responsive server pays
    # nothing for it.
    default_server_timeout: 2000
    wait_for_service_timeout: 3000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # 20 Hz. Dropping to 10 was tried, to stop bt_navigator timing out
    # waiting for controller_server to acknowledge follow_path. It did not
    # help: the timeout still happened exactly once per launch, and the same
    # goal went from 0.31 m short to 1.21 m. The timeout is first-contact
    # discovery between the two nodes, not saturation -- a SECOND goal in the
    # same session never times out.
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # "Move at least this far within movement_time_allowance or you are
      # stuck." The stock 0.5 m is tuned for a robot cruising at ~0.5 m/s over
      # room-scale distances. This robot is capped at 0.15 m/s, and a typical
      # test goal here is 0.5 m TOTAL -- so the robot could never move 0.5 m
      # between checks and was declared stuck on every single goal, no matter
      # how well it was tracking. Observed as repeated "Failed to make
      # progress", which then triggered the wait/backup/spin recovery chain;
      # the spin is why a pure-strafe goal ended with the robot rotated 130 deg.
      #
      # 0.10 m in 10 s is 0.01 m/s average. At this robot's speed that really
      # is stuck, and it leaves room for MPPI's ramp-up and for short goals.
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      # stateful TRUE, but only because the two things it depends on are now
      # right. It latches the XY check once position tolerance is met and then
      # watches heading, which is exactly what a robot arriving from a long
      # traverse needs: reach the spot, then turn.
      #
      # It was WRONG earlier in this config's life, and the measurements say
      # why. With wz_max at 1.0 rad/s the robot satisfied heading by driving an
      # arc and finished 0.60 m past the goal still reporting success. Turning
      # it off then exposed the opposite failure: MPPI does not rotate in
      # place -- it drives while turning -- so requiring position and heading
      # at the same instant meant the robot reached 4.0 cm from a goal, began
      # its ~97 deg heading correction, drifted out past 40 cm and hunted.
      #
      # The base itself is not the problem. Commanded a pure in-place turn
      # (wz only, vx = vy = 0) it closes a full 360 deg with 1.7 cm of net
      # translation. It is the controller that will not spin on the spot.
      #
      # With wz_max halved to 0.5 and xy_goal_tolerance set from the measured
      # 10.9 cm rotational excursion, latching finally does what it is for:
      # three consecutive goals reached, no hunting, no tracking loss, final
      # heading within 1 deg of the request.
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # The stock 0.25 m is most of this robot's own 0.32 m width -- it would
      # report "arrived" while standing a full body-width from the goal, and
      # on a 0.5 m test move that is half the journey. There is no reason to
      # accept that here: cuVSLAM returned a 16.4 m driven loop to 2.2 cm and
      # 1.1 deg, so the localisation is an order of magnitude better than the
      # tolerance was asking for.
      #
      # 0.10 m / 0.15 rad (8.6 deg) is comfortably inside what the pose
      # estimate supports while staying achievable for the controller.
      # 0.15 m, set from the robot's MEASURED rotational behaviour rather than
      # from ambition. Commanded a pure in-place turn (wz only, vx = vy = 0),
      # this base closes a full 360 deg with 1.7 cm of net translation -- the
      # omni kinematics are sound -- but it excursions up to 10.9 cm PART WAY
      # through the turn before coming back.
      #
      # With stateful false, position and heading have to hold at the same
      # instant. At 0.10 m the checker was asking the robot to stay inside a
      # circle smaller than its own rotational wobble, so every heading
      # correction at the goal broke the position check, and it drove on and
      # hunted. Measured: reaching 8.0 cm and 2.4 cm from a goal repeatedly
      # without ever being allowed to stop.
      #
      # 0.15 m clears the wobble with margin and is still well inside the
      # robot's 0.32 m width. Tighten it only alongside a measurement showing
      # the excursion has shrunk.
      xy_goal_tolerance: 0.15
      # 0.25 rad (14 deg), nav2's own default, up from the 0.15 this started
      # with. 0.15 was set when every goal was a short hop in open space and
      # the robot arrived already pointing the right way. Arriving from a 3.5 m
      # traverse it does not, and with stateful false -- position and heading
      # having to hold at the SAME instant -- 8.6 deg was tight enough that the
      # robot hunted: measured passing through the goal at 8.0 cm and 2.4 cm,
      # well inside the 10 cm position tolerance, without ever being allowed to
      # stop. Position accuracy is unchanged; only the heading gate is relaxed,
      # and this base is holonomic so heading costs it nothing to correct later.
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # HORIZON: 56 x 0.05 = 2.8 s, about 0.42 m of lookahead at vx_max.
      # That looks far too short for threading a cluttered room, and raising it
      # was TRIED AND MADE THINGS WORSE -- measured, on the same 3.5 m goal:
      #
      #   56 steps / batch 2000    stalled 0.62 m short ("Optimizer fail to
      #                            compute path")
      #   90 steps / batch 1400    stalled 2.71 m short, having driven only
      #                            0.78 m, with "Failed to make progress"
      #
      # The longer horizon with fewer samples did not collide, it dithered:
      # the progress checker gave up. Whatever is wrong here, lookahead is not
      # it, and batch_size is not free to trade away. Left at the measured
      # best; do not "fix" this again without a driven measurement.
      # 56 x 0.05 = 2.8 s, about 0.42 m of lookahead, and both directions
      # away from this have been measured worse: 90 steps stalled 2.71 m short,
      # 28 steps at 10 Hz stalled 1.21 m, against 0.31 m here.
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # Matched to kaya_drive's own clamps (max_linear_speed 0.15,
      # max_angular_speed 1.0). Nav2 asking for more than the drive node will
      # deliver makes MPPI's model wrong -- it would plan trajectories the
      # robot silently cannot execute. Raise BOTH together after the Phase 2
      # calibration is re-validated at higher speed.
      vx_max: 0.15
      vx_min: -0.15
      vy_max: 0.15          # non-zero ONLY because this base is holonomic
      # 0.5 rad/s, not the drive node's full 1.0. This is a LOWER limit inside
      # kaya_drive's clamp, not a change to it.
      #
      # Rotation is what loses this robot its localisation. On a 3.5 m traverse
      # the controller rotated continuously while translating -- heading went
      # +92 -> +166 -> -125 deg across the run -- and cuVSLAM reported "Visual
      # tracking is lost", after which IMU-only dead reckoning integrated the
      # pose out to kilometres. The camera was delivering frames about 66 ms
      # apart under load rather than 33, so 1.0 rad/s is roughly 4 deg of
      # rotation between frames, which is where feature matching gives up.
      #
      # Halving it halves the inter-frame rotation. Slower turns cost seconds;
      # a lost tracker costs the whole run and leaves the robot driving on a
      # pose that is fiction.
      wz_max: 0.5
      iteration_count: 1
      prune_distance: 1.7
      # MEASURED, not guessed. cuVSLAM stamps its transforms with the CAMERA's
      # frame time, so map -> odom and odom -> base_footprint are only ever as
      # fresh as the camera's clock. With the Orbbec driver's time_domain=system
      # that lag measures 0.048 s median but tails to 0.78 s.
      #
      # Nav2's 0.1 s default rejects that tail as "Transform data too old", and
      # the way that failure SURFACES is the dangerous part: the controller
      # reported "Reached the goal!" and bt_navigator logged "Goal succeeded"
      # while the robot never moved a millimetre. A silent success is far worse
      # than a loud failure.
      #
      # 0.8 s covers the measured tail. It is not free -- the controller may act
      # on a pose up to 0.8 s old, which at this robot's 0.15 m/s cap is ~12 cm
      # of position uncertainty -- so it is a ceiling to lower, not a default to
      # keep. The real fix is upstream: if the camera's stamps get tighter, bring
      # this back down. (time_domain=global was far worse: 0.897 s MEDIAN.)
      transform_tolerance: 0.8
      temperature: 0.3
      gamma: 0.015
      # *** THE most important line in this file for THIS robot. ***
      # Nav2 ships "DiffDrive", which forbids lateral velocity: the planner
      # then never commands vy and the robot turns-then-drives like a
      # two-wheeled base. Kaya is a three-wheel omni that can strafe, and
      # measured Phase 2 tests confirm pure vy motion works with no rotation.
      # "Omni" lets MPPI actually use that -- the difference between sliding
      # around a doorway and shuffling back and forth in front of it.
      motion_model: "Omni"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        # DISABLED, and that is deliberate on a holonomic base.
        # This critic penalises anything that is not forward motion. It exists
        # for differential and ackermann robots, to stop them reversing. Kaya
        # is omni -- motion_model is "Omni", vy_max is non-zero, and strafing
        # is measured at 0.5 m lateral for -0.1 deg of heading change -- so
        # this was penalising the exact manoeuvre that threads a cluttered
        # room, and the config was effectively a CRUISING profile applied to
        # precision work.
        #
        # ROBOTIS ship two MPPI profiles for their omni base and switch between
        # them: a CurveController with PreferForwardCritic at 9.0 for long open
        # runs, and an OmniController with it DISABLED for "holonomic agility
        # in tight spaces and fine positioning". Their baseline is time_steps
        # 56 / batch_size 2000, the same as here, which is also why raising the
        # horizon was the wrong lever.
        #
        # Re-enable it only if this robot is given long open corridors to
        # cruise, and then as a second profile rather than in place of this one.
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      # The COSTMAP's own tolerance -- this is the one that governs
      # getRobotPose(), and it is separate from the controller's. Neither
      # costmap declared it at all, so both silently sat on the 0.3 s default
      # while transform_tolerance was set on three OTHER nodes that were not
      # the problem. Symptom: "Transform data too old when converting from map
      # to odom", immediately followed by the controller announcing "Reached
      # the goal!" without moving. See the note at the controller above for the
      # measured camera-stamp lag this has to absorb (0.048 s median, 0.78 s
      # tail).
      transform_tolerance: 0.8
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # MEASURED: footprint_radius in kaya.urdf.xacro. The real deck is a
      # truncated triangle; a circle enclosing it (0.143 chassis radius +
      # half the 25 mm wheel width + margin) is the correct conservative
      # footprint and is convex, which the costmap wants.
      robot_radius: 0.16
      # The LOCAL costmap needs the saved map too, and an earlier version
      # of this file argued it should not. That was wrong, and the robot
      # demonstrated it: the global costmap knew the whole room, but MPPI
      # steers on THIS costmap, which saw only what the forward-facing
      # camera could see and forgets it behind the robot (nvblox runs
      # dynamic decay while navigating). Blind sideways, it drove into a
      # gap with 0.15 m of clearance -- narrower than the robot's own
      # 0.16 m radius -- and then reported "Optimizer fail to compute
      # path" until the goal aborted. Static first, live nvblox on top.
      # voxel_layer, NOT nvblox_layer, and the difference is the whole point.
      #
      # nvblox's costmap layer reads an ESDF -- a distance-to-nearest-obstacle
      # field. A distance field cannot say "I have not looked there", so
      # unobserved space is indistinguishable from occupied and it blocks by
      # default. Rendered over an open corridor the global costmap was '#'
      # everywhere except a cone narrowing to nothing a metre ahead.
      #
      # VoxelLayer raycasts instead, which gives the three states that actually
      # exist: MARK where a ray terminates, CLEAR every cell the ray passed
      # through, and leave cells no ray reached alone. That third state is the
      # one nvblox cannot express and the one this robot needs, because a
      # forward-facing camera has not looked at most of the room.
      #
      # nvblox keeps doing what it is good at -- the 3D reconstruction and the
      # saved map. It is just not an observation source for a costmap.
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        combination_method: 1          # max, so it cannot erase the static map
        origin_z: 0.0
        z_resolution: 0.05
        # 8 x 0.05 = 0.40 m, about twice the robot's 0.19 m height, so
        # overhangs that would clip the camera still register.
        z_voxels: 8
        mark_threshold: 1
        observation_sources: depth_cloud
        depth_cloud:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # Same band the nvblox slice uses, for the same measured reason: the
          # floor here is polished tile, IR stereo matches its reflections and
          # returns points just above it, and anything from 0.0 fuses them as
          # obstacles across clear floor.
          min_obstacle_height: 0.05
          max_obstacle_height: 0.40
          # MEASURED on this camera: valid depth spans 0.31-7.94 m, so nothing
          # closer than that is real. Trusting sub-0.35 m returns would both
          # invent obstacles and, worse, "clear" cells on rays that were never
          # valid. The blind zone inside 0.35 m is physics -- collision_monitor
          # and the speed cap are what cover it, not this layer.
          obstacle_min_range: 0.35
          obstacle_max_range: 3.0
          raytrace_min_range: 0.35
          # Clearing must reach past marking, or cells get marked at 3.0 m and
          # never cleared again.
          raytrace_max_range: 3.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_subscribe_transient_local: True
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35   # stock 0.70 suits a bigger robot; Kaya's radius is 0.16
      # NO LIDAR ON THIS ROBOT. Nav2's stock config expects a /scan topic;
      # obstacles here come from nvblox instead, which fuses the depth camera
      # into a TSDF, converts that to an ESDF (distance-to-nearest-obstacle),
      # and publishes a 2D slice of it. See config/nvblox.yaml for the slice
      # heights, which are set from Kaya's real 0.19 m height rather than
      # nvblox's 1.0 m default.
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        # combined_map_slice, NOT static_map_slice. With nvblox in dynamic
        # mode the two differ in exactly the way that matters: the static
        # slice has moving objects DELIBERATELY REMOVED, so subscribing to it
        # here would mean the robot cannot see a person standing in front of
        # it. Switching to dynamic mapping without also switching this topic
        # makes the robot LESS safe than static mapping was, not more, and
        # nothing warns you -- both topics publish happily at ~4.8 Hz.
        #
        # combined = static structure + whatever is currently moving, which is
        # what a costmap should contain. dynamic_map_slice alone would be the
        # opposite mistake: obstacles but no walls.
        nvblox_map_slice_topic: "/nvblox_node/combined_map_slice"
        # Beyond this the layer stops marking; keep it comfortably inside the
        # depth camera's useful range (Gemini 335L degrades with distance
        # squared, and our loop-closure work showed 3-4 m is already noisy).
        max_obstacle_distance: 1.0
        # 0.22, not the 0.35 this started from. nvblox_layer marks every
        # cell within inflation_distance of an obstacle as LETHAL -- not
        # as graded cost -- so 0.35 m is a hard no-go band more than twice
        # the robot's 0.16 m radius. That was invisible while the costmap
        # held only the camera cone. With the whole saved map present it
        # measured 46.9%% lethal in the 3 x 3 m local window, 66.5%% of it
        # unable to hold the footprint, at a pose with 0.41 m of real
        # clearance -- and MPPI could not find a trajectory out.
        # 0.22 keeps a 6 cm margin beyond the robot's own radius, with
        # inflation_layer's gradient and collision_monitor behind it.
        inflation_distance: 0.22
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # The COSTMAP's own tolerance -- this is the one that governs
      # getRobotPose(), and it is separate from the controller's. Neither
      # costmap declared it at all, so both silently sat on the 0.3 s default
      # while transform_tolerance was set on three OTHER nodes that were not
      # the problem. Symptom: "Transform data too old when converting from map
      # to odom", immediately followed by the controller announcing "Reached
      # the goal!" without moving. See the note at the controller above for the
      # measured camera-stamp lag this has to absorb (0.048 s median, 0.78 s
      # tail).
      transform_tolerance: 0.8
      # MEASURED: footprint_radius in kaya.urdf.xacro. The real deck is a
      # truncated triangle; a circle enclosing it (0.143 chassis radius +
      # half the 25 mm wheel width + margin) is the correct conservative
      # footprint and is convex, which the costmap wants.
      robot_radius: 0.16
      resolution: 0.05
      track_unknown_space: true

      # ------------------------------------------------ EXTENT: set explicitly
      # These four lines are load-bearing, and their absence is not a harmless
      # default. Nav2's stock global costmap is sized by the static map from
      # map_server. This robot has no map_server -- SLAM supplies map -> odom
      # and nvblox supplies obstacles, but nobody publishes an OccupancyGrid --
      # so the costmap fell back to 5 x 5 m with its CORNER at the origin,
      # covering x,y in [0, 5].
      #
      # cuVSLAM starts the robot at map (0, 0), which is that corner. Half the
      # robot's own noise puts it on the wrong side: measured at
      # (0.007, -0.017), i.e. 17 mm below the bottom edge. Every plan request
      # then failed with "Robot is out of bounds of the costmap", the planner
      # returned nothing, no cmd_vel was ever published, and the robot simply
      # sat there with a goal accepted and Nav2 reporting healthy. Nothing in
      # the lifecycle state says anything is wrong.
      #
      # Centring the window on the origin is what makes the start pose interior
      # rather than a corner. 20 x 20 m at 5 cm is 160k cells -- cheap -- and
      # covers any indoor space this robot will see before Phase 6 adds map
      # save/load.
      #
      # Deliberately NOT rolling_window. The local costmap rolls (3 x 3 m, see
      # above) because the controller only needs what is nearby, but the global
      # costmap should retain everywhere nvblox has already mapped, so the
      # planner can route back through explored space it can no longer see.
      rolling_window: false
      width: 20
      height: 20
      origin_x: -10.0
      origin_y: -10.0
      # NO nvblox_layer HERE, and that is the whole point.
      #
      # nvblox sees a forward-facing cone and decays what it has driven past,
      # so it can only ever describe the neighbourhood. Asked to describe a
      # 202 m^2 global costmap it paints everything it has not currently
      # observed as LETHAL, which overrode the static map's free space:
      # rendered side by side, the saved map showed an open corridor from the
      # robot to the goal while the live global costmap showed '#' everywhere
      # except a cone narrowing to nothing about 1 m ahead. The global planner
      # could only ever plan inside the camera's field of view, which is why
      # every long goal stalled a few metres out no matter which map was
      # loaded -- the reloaded .nvblx behaved identically for the same reason.
      #
      # So: the global costmap describes the building, from the saved map. The
      # LOCAL costmap keeps nvblox and handles what is actually in front of the
      # robot now, including furniture that has moved since the map was built.
      # That is the ordinary Nav2 split; nvblox was only ever meant to be the
      # global obstacle source on a robot with no saved map at all.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        # map_server latches /map; a VOLATILE subscription matches
        # nothing and the costmap comes up empty with no error printed.
        map_subscribe_transient_local: True
        subscribe_to_updates: false
      # NO LIDAR ON THIS ROBOT. Nav2's stock config expects a /scan topic;
      # obstacles here come from nvblox instead, which fuses the depth camera
      # into a TSDF, converts that to an ESDF (distance-to-nearest-obstacle),
      # and publishes a 2D slice of it. See config/nvblox.yaml for the slice
      # heights, which are set from Kaya's real 0.19 m height rather than
      # nvblox's 1.0 m default.
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        # combined_map_slice, NOT static_map_slice. With nvblox in dynamic
        # mode the two differ in exactly the way that matters: the static
        # slice has moving objects DELIBERATELY REMOVED, so subscribing to it
        # here would mean the robot cannot see a person standing in front of
        # it. Switching to dynamic mapping without also switching this topic
        # makes the robot LESS safe than static mapping was, not more, and
        # nothing warns you -- both topics publish happily at ~4.8 Hz.
        #
        # combined = static structure + whatever is currently moving, which is
        # what a costmap should contain. dynamic_map_slice alone would be the
        # opposite mistake: obstacles but no walls.
        nvblox_map_slice_topic: "/nvblox_node/combined_map_slice"
        # Beyond this the layer stops marking; keep it comfortably inside the
        # depth camera's useful range (Gemini 335L degrades with distance
        # squared, and our loop-closure work showed 3-4 m is already noisy).
        max_obstacle_distance: 1.0
        # 0.22, not the 0.35 this started from. nvblox_layer marks every
        # cell within inflation_distance of an obstacle as LETHAL -- not
        # as graded cost -- so 0.35 m is a hard no-go band more than twice
        # the robot's 0.16 m radius. That was invisible while the costmap
        # held only the camera cone. With the whole saved map present it
        # measured 46.9%% lethal in the 3 x 3 m local window, 66.5%% of it
        # unable to hold the footprint, at a pose with 0.41 m of real
        # clearance -- and MPPI could not find a trajectory out.
        # 0.22 keeps a 6 cm margin beyond the robot's own radius, with
        # inflation_layer's gradient and collision_monitor behind it.
        inflation_distance: 0.22
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35   # stock 0.70 suits a bigger robot; Kaya's radius is 0.16
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    # See the note at the controller's transform_tolerance above.
    transform_tolerance: 0.8
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # [x, y, theta]. THE MIDDLE ELEMENT IS LATERAL VELOCITY, and nav2_bringup
    # ships it as 0.0 because its reference robot is a differential-drive
    # TurtleBot that physically cannot strafe.
    #
    # Left at 0.0 on this holonomic base it silently destroys the whole point
    # of the Omni motion model set in the controller above. Measured on a
    # 0.5 m strafe goal: MPPI produced a correct lateral command on
    # /cmd_vel_nav, peaking at 0.133 m/s -- and every one of the 1043
    # /cmd_vel_smoothed samples that came out the other side had y = 0.0
    # exactly. The robot sat still while Nav2 reported healthy, and the only
    # visible symptom was the progress checker eventually giving up with
    # "Failed to make progress". Nothing named the smoother.
    #
    # x and theta are also brought in line with what the hardware will
    # actually do: the smoother must not authorise more than kaya_drive's own
    # clamps (0.15 m/s, 1.0 rad/s) or it hands the robot commands it silently
    # saturates. Accelerations stay symmetric in x and y because the base is.
    max_velocity: [0.15, 0.15, 1.0]
    min_velocity: [-0.15, -0.15, -1.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    # See the note at the controller's transform_tolerance above.
    transform_tolerance: 0.8
    # MEASURED. The depth cloud's stamp lag under the full stack is 0.508 s
    # median / 0.535 s p90 / 0.935 s max -- and the stock 1.0 s timeout sits
    # right on top of that max, so the source was rejected intermittently:
    #
    #   [depth_cloud]: Latest source and current collision monitor node
    #   timestamps differ on 1.039636 seconds. Ignoring the source.
    #   Robot to stop due to invalid source.
    #
    # collision_monitor's response to losing its only source is to STOP the
    # robot, which is the right call in principle but meant the robot was
    # braking itself mid-goal for no physical reason.
    #
    # 1.5 s clears the measured max with margin. Be clear about what that
    # buys and costs: this layer may now act on obstacle data up to 1.5 s old,
    # which at 0.15 m/s is ~22 cm of travel against a 0.16 m robot radius. It
    # is a BACKSTOP, not the primary avoidance -- nvblox and the costmap are
    # the primary, and they see the same data sooner.
    #
    # The lag is not inherent: idle, these same topics stamp within 0.030 s.
    # It is contention. If the pipeline gets lighter, bring this back down.
    source_timeout: 1.5
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    # NO LIDAR ON THIS ROBOT. The stock config lists a "scan" source on /scan,
    # which nothing publishes here -- and collision_monitor does not fail
    # loudly when its only source never arrives, it just keeps stopping the
    # robot. Combined with the smoother bug above this was the second reason a
    # strafe goal produced no motion: even the residual x velocities that
    # survived the smoother came out of collision_monitor as exact zeros.
    #
    # The depth camera's own point cloud is the honest replacement. It keeps
    # collision_monitor doing its real job -- a last-resort safety layer that
    # is INDEPENDENT of the costmap and the planner, so a bug in nvblox or the
    # controller cannot drive the robot into something.
    #
    # Heights are relative to base_frame_id (base_footprint), which sits on
    # the floor, so unlike nvblox's slice these need no wheel-radius offset.
    # The band matches config/nvblox.yaml: 5 cm clears floor noise, 20 cm is
    # just over the robot's own height.
    observation_sources: ["depth_cloud"]
    depth_cloud:
      type: "pointcloud"
      topic: "/camera/depth/points"
      min_height: 0.05
      max_height: 0.20
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      # See the note at the controller's transform_tolerance above.
      transform_tolerance: 0.8
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
