### Phase 3: fuse wheel odometry with the camera's built-in IMU.
#
# REVISED 2026-09-03 after a real ~6-minute drive test: the original config
# fed vyaw from the IMU ONLY (gyro-exclusive rotation), reasoning the gyro is
# far cleaner short-term. True, but that also means NOTHING ever corrects the
# gyro's residual bias -- it is a pure, unbounded integral. Measured result:
# fused yaw drifted ~58 deg over the session (~10 deg/min) while the robot
# was back within a few cm of its start and raw wheel yaw read -4.9 deg (much
# closer to reality) -- worse than gyro-only integration alone would predict
# from Phase 1's cold 0.19 deg/min figure, meaning today's residual bias was
# meaningfully larger than that one earlier short sample.
#
# Fix: feed BOTH sources' yaw rate. Gyro (imu0) still dominates
# moment-to-moment -- its measured covariance is ~1e-6 (rad/s)^2 vs odom0's
# ~0.02 placeholder, several orders of magnitude tighter -- but the wheels
# now provide a non-drifting anchor: unlike gyro bias, wheel-derived yaw rate
# does not integrate a constant systematic error over time (its error is
# chassis_radius calibration scale error, not a monotonic walk), and reads
# genuinely near-zero when the robot is actually stationary, which is
# exactly the case gyro-only integration failed on. Standard complementary-
# filter reasoning: don't exclude a source entirely, weight by real noise
# and let the filter's own math do the tradeoff.
#
# Wheel odometry still supplies vx, vy (this is a holonomic base, so both
# matter, not just vx like a diff-drive). Neither source's own pose is fed
# in -- odom0's x/y/yaw would just replay drift, and the IMU has no
# magnetometer so its orientation field is meaningless (REP-145
# orientation_covariance[0] = -1, camera_imu_node already declares this).
# The EKF does its own pose integration from the fused velocities instead.
#
# world_frame = odom, not map: there is no map->odom correction from THIS
# node (that's RTAB-Map/cuVSLAM's job in Phase 4). This EKF only ever
# publishes odom -> base_footprint.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint   # matches drive_node's odom child_frame_id;
                                       # base_footprint -> base_link is the URDF's
                                       # own fixed transform, untouched by this EKF
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
