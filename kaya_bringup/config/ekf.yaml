### Phase 3: fuse wheel odometry with the camera's built-in IMU.
#
# Deliberately asymmetric about what each source is trusted for (curriculum
# Sec. 03): wheel odometry supplies linear velocity (vx, vy -- this is a
# holonomic base, so both matter, not just vx like a diff-drive); the IMU
# supplies yaw RATE. Neither source's own pose/orientation is fed in --
# odom0's x/y/yaw would just replay its own drift, and the IMU has no
# magnetometer so its orientation field is meaningless (REP-145
# orientation_covariance[0] = -1, camera_imu_node already declares this).
# The EKF does its own pose integration from the fused velocities instead.
#
# world_frame = odom, not map: there is no map->odom correction yet
# (that's Phase 4, cuVSLAM's job). This EKF only ever publishes
# odom -> base_footprint.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint   # matches drive_node's odom child_frame_id;
                                       # base_footprint -> base_link is the URDF's
                                       # own fixed transform, untouched by this EKF
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
