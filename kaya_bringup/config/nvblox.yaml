### Phase 5: nvblox -- the LiDAR replacement.
#
# Fuses the depth camera into a TSDF, converts that to an ESDF
# (distance-to-nearest-obstacle, which is exactly what a planner wants), and
# publishes a 2D slice of it for Nav2's costmap. Kaya has no LiDAR, so this
# is where every obstacle in the costmap comes from.
#
# ---------------------------------------------------------------------------
# THE SLICE HEIGHTS ARE THE POINT OF THIS FILE, AND THEY ARE MEASURED FROM
# THE FLOOR -- but only because slam_cuvslam.launch.py anchors cuVSLAM to
# base_footprint. Change that and every number here silently becomes wrong.
#
# nvblox slices in the GLOBAL frame, whose origin is wherever cuVSLAM zeroes
# itself: its base_frame. base_footprint is the floor projection, so map z=0
# is floor level and these heights mean what they say.
#
# We got this wrong once, and it is worth recording how. cuVSLAM was
# originally anchored to base_link, which the URDF places one wheel radius up
# (base_footprint -> base_link = 0.037 m, verified live). That silently
# raised the whole obstacle band by 37 mm: the floor of it sat at 8.7 cm
# rather than the 5 cm written here, so a book, a door threshold, a cable
# bundle or a shoe was invisible to the planner -- and with 37 mm wheels that
# cannot climb, every one of those is a collision.
#
# The base_link anchoring was a genuine bug in its own right (it gave
# base_link two TF parents and split the tree, so Nav2's costmaps could not
# activate). Fixing it there fixed the heights here as a side effect. Left as
# a warning: these numbers are only floor-referenced for as long as
# cuVSLAM's base_frame is a floor-level frame.
# ---------------------------------------------------------------------------

/**:
  ros__parameters:
    # 5 cm. For a base 0.32 m across this resolves a doorway and a chair leg
    # while staying affordable: voxel memory scales cubically, and on 8 GB
    # shared with cuVSLAM there is no headroom to be casual. Drop to 0.04 only
    # if genuinely needed, and watch RAM when you do.
    voxel_size: 0.05

    # static_tsdf: one rigid world. dynamic/occupancy modes cost more and buy
    # nothing until Phase 7-8 wants moving-object handling.
    mapping_type: static_tsdf
    esdf_mode: 2d

    static_mapper:
      # 5 cm off the ground: the obstacle band starts here.
      #
      # An earlier revision of this file warned against lowering the band
      # because it would "admit floor noise as phantom obstacles". That was
      # tested rather than argued, on one identical stationary scene, corridor
      # 0.4-1.5 m ahead by +-0.4 m lateral, 352 observed cells both times:
      #
      #     band starting 8.7 cm up:  14 cells marked obstacle (4.0%)
      #     band starting 5.0 cm up:  15 cells marked obstacle (4.3%)
      #
      # One cell. The rendered slice showed no floor wedge in either -- free
      # space stayed a clean FOV triangle with compact obstacles at its edges.
      # There is no floor noise here to admit, and the camera pose is why: it
      # is mounted at 0.1737 m and pitched 4.89 deg NOSE UP, so it barely
      # images the near floor at all. That same pitch is why the near-field
      # blind spot is real and cannot be tuned away from this file.
      #
      # Going below 5 cm is untested. Do not, without repeating that A/B.
      esdf_slice_min_height: 0.05
      # A little over the 0.19 m camera top, so overhangs that would clip the
      # camera still count as obstacles.
      esdf_slice_max_height: 0.20
      # Where the published 2D slice is reported -- mid-body: clear of floor
      # speckle, low enough to catch low obstacles.
      esdf_slice_height: 0.10

      # Depth beyond this is not integrated. The Gemini 335L's stereo error
      # grows with distance squared -- our Phase 4 loop-closure work already
      # showed 3-4 m is where it gets noisy -- and integrating far, wrong
      # depth smears the TSDF. 3 m keeps what is trustworthy.
      projective_integrator_max_integration_distance_m: 3.0
      esdf_integrator_max_distance_m: 2.0

    publish_esdf_distance_slice: true
