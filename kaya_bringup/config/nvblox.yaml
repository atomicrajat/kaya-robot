### Phase 5: nvblox -- the LiDAR replacement.
#
# Fuses the depth camera into a TSDF, converts that to an ESDF
# (distance-to-nearest-obstacle, which is exactly what a planner wants), and
# publishes a 2D slice of it for Nav2's costmap. Kaya has no LiDAR, so this
# is where every obstacle in the costmap comes from.
#
# ---------------------------------------------------------------------------
# THE SLICE HEIGHTS ARE THE POINT OF THIS FILE, AND THEY ARE MEASURED FROM
# THE FLOOR -- but only because slam_cuvslam.launch.py anchors cuVSLAM to
# base_footprint. Change that and every number here silently becomes wrong.
#
# nvblox slices in the GLOBAL frame, whose origin is wherever cuVSLAM zeroes
# itself: its base_frame. base_footprint is the floor projection, so map z=0
# is floor level and these heights mean what they say.
#
# We got this wrong once, and it is worth recording how. cuVSLAM was
# originally anchored to base_link, which the URDF places one wheel radius up
# (base_footprint -> base_link = 0.037 m, verified live). That silently
# raised the whole obstacle band by 37 mm: the floor of it sat at 8.7 cm
# rather than the 5 cm written here, so a book, a door threshold, a cable
# bundle or a shoe was invisible to the planner -- and with 37 mm wheels that
# cannot climb, every one of those is a collision.
#
# The base_link anchoring was a genuine bug in its own right (it gave
# base_link two TF parents and split the tree, so Nav2's costmaps could not
# activate). Fixing it there fixed the heights here as a side effect. Left as
# a warning: these numbers are only floor-referenced for as long as
# cuVSLAM's base_frame is a floor-level frame.
# ---------------------------------------------------------------------------

/**:
  ros__parameters:
    # 5 cm. For a base 0.32 m across this resolves a doorway and a chair leg
    # while staying affordable: voxel memory scales cubically, and on 8 GB
    # shared with cuVSLAM there is no headroom to be casual. Drop to 0.04 only
    # if genuinely needed, and watch RAM when you do.
    voxel_size: 0.05

    # dynamic, not static_tsdf. static_tsdf assumes one rigid world and fuses
    # EVERYTHING it sees into it permanently -- so a person walking past the
    # robot becomes a wall that is still there after they have left, and the
    # planner keeps routing around a doorway that is actually clear.
    #
    # dynamic mode separates geometry that moves from geometry that does not.
    # It maintains an extra set of voxel layers to do so; measured cost on this
    # board, full stack running:
    #
    #     peak system used   3433 -> 3595 MB   (+162 MB)
    #     nvblox RSS         1085 -> 1197 MB   (+112 MB)
    #     memory available   4112 -> 3950 MB
    #
    # Affordable, and it buys the robot the ability to work around people.
    #
    # IMPORTANT: this changes which topic Nav2 must consume. See
    # nvblox_map_slice_topic in nav2.yaml -- the static slice now has moving
    # objects removed from it, so subscribing to it would hide people from the
    # costmap entirely. The two files have to be reasoned about together.
    #
    # The other modes: static_occupancy is a lighter, less accurate static map;
    # human_with_static_tsdf and human_with_static_occupancy do the same
    # separation but driven by a SEGMENTATION MASK rather than geometry, which
    # needs a network (isaac_ros_unet, not installed) and more GPU. Geometric
    # detection needs neither and handles anything that moves, not just people.
    mapping_type: dynamic
    esdf_mode: 2d

    # THE DYNAMIC MAPPER NEEDS THE SAME SLICE, and for a long time it did not
    # have it. mapping_type is "dynamic", so while NAVIGATING the costmap is
    # fed by the dynamic mapper -- and every slice setting below was nested
    # under static_mapper, which only applies to a deliberate mapping run.
    # Read back from the running node, dynamic_mapper.esdf_slice_min_height
    # was 0.0: the obstacle band started AT THE FLOOR PLANE.
    #
    # Measured consequence, on a corridor the saved 2D map calls free with
    # 0.50-0.75 m of clearance: the live costmap put cost 66-79 across every
    # cell of it and 0.00 m of clearance, and MPPI stalled 0.6-1.0 m short of
    # the goal with "Optimizer fail to compute path" -- on both the reloaded
    # .nvblx and the 2D grid, which is why swapping the map changed nothing.
    # The hallway floor is polished tile; IR stereo matches its reflections and
    # returns points just above the floor, and a slice starting at 0.0 fuses
    # every one of them as an obstacle.
    #
    # The saved map is clean because it was built in MAPPING mode, where the
    # static_mapper's 0.05 was doing its job all along.
    # GROUND-PLANE SLICING WAS TRIED AND IS WORSE. nvblox can place the slice
    # relative to a floor it estimates rather than to a fixed height, via
    # multi_mapper.experimental_use_ground_plane_estimation with
    # slice_height_above_plane_m / slice_height_thickness_m. On paper it is the
    # right answer to a polished floor and to cuVSLAM's z drift. Measured here
    # it lost on both counts:
    #
    #   fixed slice 0.05-0.20      local costmap 44.8% unable to hold the
    #                              footprint, goal missed by 0.43 m
    #   plane + 0.05, 0.15 thick   53.2% unable to hold the footprint,
    #                              goal missed by 1.07 m
    #
    # It is flagged experimental upstream, and this room may simply not give it
    # a clean plane to fit. Left off; the numbers are here so it is not
    # re-enabled on the strength of the idea alone.
    dynamic_mapper:
      esdf_slice_min_height: 0.05
      esdf_slice_max_height: 0.20
      esdf_slice_height: 0.10

    static_mapper:
      # 5 cm off the ground: the obstacle band starts here.
      #
      # An earlier revision of this file warned against lowering the band
      # because it would "admit floor noise as phantom obstacles". That was
      # tested rather than argued, on one identical stationary scene, corridor
      # 0.4-1.5 m ahead by +-0.4 m lateral, 352 observed cells both times:
      #
      #     band starting 8.7 cm up:  14 cells marked obstacle (4.0%)
      #     band starting 5.0 cm up:  15 cells marked obstacle (4.3%)
      #
      # One cell. The rendered slice showed no floor wedge in either -- free
      # space stayed a clean FOV triangle with compact obstacles at its edges.
      # There is no floor noise here to admit, and the camera pose is why: it
      # is mounted at 0.1737 m and pitched 4.89 deg NOSE UP, so it barely
      # images the near floor at all. That same pitch is why the near-field
      # blind spot is real and cannot be tuned away from this file.
      #
      # Going below 5 cm is untested. Do not, without repeating that A/B.
      esdf_slice_min_height: 0.05
      # A little over the 0.19 m camera top, so overhangs that would clip the
      # camera still count as obstacles.
      esdf_slice_max_height: 0.20
      # Where the published 2D slice is reported -- mid-body: clear of floor
      # speckle, low enough to catch low obstacles.
      esdf_slice_height: 0.10

      # Depth beyond this is not integrated. The Gemini 335L's stereo error
      # grows with distance squared -- our Phase 4 loop-closure work already
      # showed 3-4 m is where it gets noisy -- and integrating far, wrong
      # depth smears the TSDF. 3 m keeps what is trustworthy.
      projective_integrator_max_integration_distance_m: 3.0
      esdf_integrator_max_distance_m: 2.0

    # How often depth is FUSED, independent of how fast it arrives. The
    # default is 40 Hz -- faster than the camera's 30 Hz, so every single frame
    # gets integrated. That is the dominant load in this stack, and it starves
    # the very pipeline feeding it: measured on the full mapping stack, depth
    # arrived at only 17.4 Hz and cuVSLAM logged 3.8 dropped-frame warnings per
    # second. Over a 32-minute mapping run that came to 8797 dropped frames and
    # 45 cm of vertical pose drift, which left nvblox's own obstacle band 55 cm
    # above the floor the robot was standing on. The map was unusable.
    #
    # 10 Hz is not a compromise, it is still oversampled. At this robot's
    # 0.15 m/s cap that is one fusion every 1.5 cm of travel against a 5 cm
    # voxel -- three integrations per voxel crossed. Nothing is lost.
    #
    # Note the neighbours: colour, ESDF and mesh all default to a sensible
    # 5 Hz. Depth at 40 was the outlier, not the rule.
    integrate_depth_rate_hz: 10.0

    # nvblox DELETES the map outside this radius of the robot, once per
    # second. The default is 5 m, which is right for a robot that only needs
    # local obstacle avoidance and completely wrong for building a map of a
    # building: it erases everywhere you have been as you drive away from it.
    #
    # Measured: a 59.55 m mapping run with good odometry (1.05% raw VIO drift,
    # 5 cm loop closure) produced a mesh covering only 17.3 m^2 -- a window
    # around wherever the robot happened to finish. An earlier 32-minute run
    # produced 17.9 m^2 for the same reason, which was wrongly blamed on drift
    # at the time.
    #
    # 100 m keeps everything for any indoor space this robot will map. It is
    # not free -- TSDF memory grows with mapped surface area, though only near
    # surfaces, so it is far cheaper than the radius suggests. nvblox measured
    # 1197 MB resident on the 17 m^2 map with ~3.9 GB free, so there is room;
    # watch it on much larger spaces and lower this if memory gets tight.
    #
    # This is the setting to change if the robot is ever used for pure local
    # navigation in a big building, where retaining everything is pointless.
    map_clearing_radius_m: 100.0

    # The visualisation layers are clipped separately from the map itself, and
    # to the same 5 m by default. This governs what is published for RViz or
    # Foxglove -- and the mesh that came back from save_ply measured 3.07 x
    # 5.61 m, consistent with either limit, so both are raised rather than
    # guessing which one truncated it.
    #
    # Height 3 m rather than the default 2 m so tall rooms and stairwells are
    # not sliced off at the ceiling.
    layer_visualization_exclusion_radius_m: 100.0
    layer_visualization_exclusion_height_m: 3.0

    publish_esdf_distance_slice: true
