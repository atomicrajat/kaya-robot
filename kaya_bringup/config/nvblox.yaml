### Phase 5: nvblox -- the LiDAR replacement.
#
# Fuses the depth camera into a TSDF, converts that to an ESDF
# (distance-to-nearest-obstacle, which is exactly what a planner wants), and
# publishes a 2D slice of it for Nav2's costmap. Kaya has no LiDAR, so this
# is where every obstacle in the costmap comes from.
#
# ---------------------------------------------------------------------------
# THE SLICE HEIGHTS ARE THE POINT OF THIS FILE, AND THEY ARE NOT MEASURED
# FROM THE FLOOR.
#
# nvblox slices in the GLOBAL frame. Our global frame's origin is base_link
# (cuVSLAM zeroes map there), and base_link sits one wheel radius up:
#
#     base_footprint -> base_link  =  0.037 m        (verified live via tf2_echo)
#
# So every height below is 37 mm HIGHER off the ground than its number reads.
# This bit us once already: the previous values were written as though they
# were floor-referenced ("min 0.05 above the floor plane"), which actually
# put the floor of the obstacle band at 8.7 cm. Anything shorter than that --
# a book, a door threshold, a cable bundle, a shoe -- was invisible to the
# costmap, and with 37 mm wheels that cannot climb, every one of those is a
# collision.
#
# Each value is therefore written as (desired height above FLOOR) - 0.037.
# If the wheel radius ever changes, all three change.
# ---------------------------------------------------------------------------

/**:
  ros__parameters:
    # 5 cm. For a base 0.32 m across this resolves a doorway and a chair leg
    # while staying affordable: voxel memory scales cubically, and on 8 GB
    # shared with cuVSLAM there is no headroom to be casual. Drop to 0.04 only
    # if genuinely needed, and watch RAM when you do.
    voxel_size: 0.05

    # static_tsdf: one rigid world. dynamic/occupancy modes cost more and buy
    # nothing until Phase 7-8 wants moving-object handling.
    mapping_type: static_tsdf
    esdf_mode: 2d

    static_mapper:
      # 0.013 = 0.05 above floor. The obstacle band starts 5 cm off the ground.
      #
      # The earlier value (0.05, i.e. 8.7 cm up) carried a warning not to lower
      # it because doing so would "admit floor noise as phantom obstacles".
      # That warning was wrong, and it was tested rather than argued: an A/B on
      # one identical stationary scene, corridor 0.4-1.5 m ahead by +-0.4 m
      # lateral, 352 observed cells both times --
      #
      #     8.7 cm band:  14 cells marked obstacle (4.0%)
      #     5.0 cm band:  15 cells marked obstacle (4.3%)
      #
      # One cell. No floor wedge appeared in the rendered slice either; free
      # space stayed a clean FOV triangle with compact obstacles at its edges.
      #
      # The reason there is no floor noise to admit is the camera pose: it is
      # mounted at 0.1737 m and pitched 4.89 deg NOSE UP, so it barely images
      # the near floor in the first place. That same pitch is why the
      # near-field blind spot below is real and cannot be tuned away here.
      esdf_slice_min_height: 0.013
      # 0.163 = 0.20 above floor: a little over the 0.19 m camera top, so
      # overhangs that would clip the camera still count as obstacles.
      esdf_slice_max_height: 0.163
      # 0.063 = 0.10 above floor. Where the published 2D slice is reported --
      # mid-body: clear of floor speckle, low enough to catch low obstacles.
      esdf_slice_height: 0.063

      # Depth beyond this is not integrated. The Gemini 335L's stereo error
      # grows with distance squared -- our Phase 4 loop-closure work already
      # showed 3-4 m is where it gets noisy -- and integrating far, wrong
      # depth smears the TSDF. 3 m keeps what is trustworthy.
      projective_integrator_max_integration_distance_m: 3.0
      esdf_integrator_max_distance_m: 2.0

    publish_esdf_distance_slice: true
